name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install
      run: |
        pip install PyQt5 Pillow pyinstaller
    
    - name: Build
      run: |
        cd src
        pyinstaller --onefile --windowed --name ImageViewer --paths=. main.py
    
    - uses: actions/upload-artifact@v4
      with:
        name: ImageViewer
        path: src/dist/ImageViewer.exe
