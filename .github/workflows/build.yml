name: Build Optimized Pekoviewer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
    
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: 'pip'
    
    - name: Install optimized packages
      run: |
        python -m pip install --upgrade pip
        pip install PyQt5 Pillow pyinstaller nuitka cython zstandard
    
    - name: Build with Nuitka (fastest)
      working-directory: src
      shell: cmd
      run: |
        python -m nuitka --mingw64 --windows-disable-console --standalone --enable-plugin=pyqt5 --output-dir=dist --output-filename=Pekoviewer.exe main.py
    
    - name: Upload
      uses: actions/upload-artifact@v5
      with:
        name: Pekoviewer_Optimized
        path: src/dist/
