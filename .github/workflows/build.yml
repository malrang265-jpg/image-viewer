name: Build Portable with Icon

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v5
    
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    
    - name: Install
      run: pip install PyQt5 Pillow pyinstaller
    
    - name: Build
      working-directory: src
      shell: cmd
      run: |
        if exist icon.ico (
          pyinstaller --windowed --icon=icon.ico --add-data "icon.ico;." --name Pekoviewer --noconfirm main.py
        ) else if exist ..\icon.ico (
          copy ..\icon.ico .
          pyinstaller --windowed --icon=icon.ico --add-data "icon.ico;." --name Pekoviewer --noconfirm main.py
        ) else (
          pyinstaller --windowed --name Pekoviewer --noconfirm main.py
        )
    
    - name: Upload folder
      uses: actions/upload-artifact@v5
      with:
        name: Pekoviewer_Portable
        path: src/dist/Pekoviewer/
