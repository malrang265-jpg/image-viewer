name: Build Pekoviewer EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v5
    
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt5 Pillow pyinstaller
    
    - name: Build EXE
      shell: cmd
      run: |
        if exist icon.ico (
          pyinstaller --onefile --windowed --icon=icon.ico --add-data "icon.ico;." --name Pekoviewer main.py
        ) else (
          pyinstaller --onefile --windowed --name Pekoviewer main.py
        )
    
    - uses: actions/upload-artifact@v5
      with:
        name: Pekoviewer
        path: dist/Pekoviewer.exe
