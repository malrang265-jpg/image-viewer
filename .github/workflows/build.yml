name: Build Pekoviewer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Debug - List files
      shell: cmd
      run: |
        echo Current directory:
        cd
        echo All files:
        dir /s /b
    
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt5 Pillow pyinstaller
    
    - name: Build EXE
      shell: cmd
      run: |
        pyinstaller --windowed --name Pekoviewer main.py
    
    - name: Create ZIP
      shell: powershell
      run: |
        Compress-Archive -Path "dist\Pekoviewer\*" -DestinationPath "dist\Pekoviewer_Portable.zip"
    
    - name: Upload Portable ZIP
      uses: actions/upload-artifact@v5
      with:
        name: Pekoviewer_Portable
        path: dist/Pekoviewer_Portable.zip
