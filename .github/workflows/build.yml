name: Build Pekoviewer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v5
    
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt5 Pillow pyinstaller
    
    - name: Build EXE (폴더 형태)
      shell: cmd
      run: |
        if exist icon.ico (
          pyinstaller --windowed --icon=icon.ico --name Pekoviewer main.py
        ) else (
          pyinstaller --windowed --name Pekoviewer main.py
        )
    
    - name: ZIP으로 압축 (폴더 전체)
      shell: powershell
      run: |
        Compress-Archive -Path "dist\Pekoviewer\*" -DestinationPath "dist\Pekoviewer_Portable.zip"
    
    - name: Upload ZIP
      uses: actions/upload-artifact@v5
      with:
        name: Pekoviewer_Portable
        path: dist/Pekoviewer_Portable.zip
    
    - name: Upload EXE (개별 다운로드용)
      uses: actions/upload-artifact@v5
      with:
        name: Pekoviewer_exe_only
        path: dist/Pekoviewer/Pekoviewer.exe
