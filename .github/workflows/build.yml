name: Build Portable Folder

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v5
    
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    
    - name: Install
      run: pip install PyQt5 Pillow pyinstaller
    
    - name: Build folder
      working-directory: src
      run: pyinstaller --windowed --name Pekoviewer --noconfirm main.py
    
    - name: List result
      run: dir src\dist\Pekoviewer
    
    - name: Upload entire folder
      uses: actions/upload-artifact@v5
      with:
        name: Pekoviewer_Portable_Folder
        path: src/dist/Pekoviewer/
