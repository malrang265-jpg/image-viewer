name: Build Pekoviewer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 Pillow opencv-python-headless pyinstaller

      - name: Build with icon
        working-directory: src
        shell: cmd
        run: |
          if exist icon.ico (
            pyinstaller --windowed --icon=icon.ico --add-data "icon.ico;." --name Pekoviewer --noconfirm --clean --hidden-import numpy --hidden-import cv2 main.py
          ) else if exist ..\icon.ico (
            copy ..\icon.ico .
            pyinstaller --windowed --icon=icon.ico --add-data "icon.ico;." --name Pekoviewer --noconfirm --clean --hidden-import numpy --hidden-import cv2 main.py
          ) else (
            pyinstaller --windowed --name Pekoviewer --noconfirm --clean --hidden-import numpy --hidden-import cv2 main.py
          )

      - name: Upload Portable Folder
        uses: actions/upload-artifact@v5
        with:
          name: Pekoviewer_Portable
          path: src/dist/Pekoviewer/
